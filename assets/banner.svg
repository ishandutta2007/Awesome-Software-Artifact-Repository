<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      fill: #9ca3af;
    }

    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #c084fc;
      letter-spacing: 1px;
    }

    /* Animated background elements */
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 4,4;
    }

    .pulse-circle {
      animation: pulse 4s infinite ease-in-out;
    }

    .floating-box {
      animation: float 6s infinite ease-in-out;
    }

    .scanning-beam {
      animation: scan 8s infinite linear;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes scan {
      0% { transform: translateX(-200px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateX(1400px); opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Pattern in Background -->
  <g opacity="0.3">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Glowing Background Orbs (Behind Text) -->
  <circle cx="150" cy="100" r="180" fill="#4f46e5" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="1050" cy="260" r="200" fill="#ec4899" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="900" cy="80" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)" />

  <!-- Animated Dynamic Artifact Nodes (Positioned on sides/background so they do NOT overlap text) -->
  <g opacity="0.7">
    <!-- Node 1: Docker / Container Package -->
    <g transform="translate(980, 70)">
      <rect x="0" y="0" width="140" height="70" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="70" y="32" font-family="sans-serif" font-size="12" fill="#818cf8" font-weight="bold" text-anchor="middle">OCI / DOCKER</text>
      <text x="70" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">v2.4.0 • Verified</text>
      <circle cx="125" cy="15" r="4" fill="#22c55e" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Node 2: NPM Package -->
    <g transform="translate(1030, 160)">
      <rect x="0" y="0" width="130" height="65" rx="10" fill="#31121d" stroke="#f43f5e" stroke-width="1.5" />
      <text x="65" y="30" font-family="sans-serif" font-size="12" fill="#fda4af" font-weight="bold" text-anchor="middle">NPM REGISTRY</text>
      <text x="65" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">tgz • Signed</text>
      <circle cx="115" cy="15" r="4" fill="#f43f5e" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Node 3: Maven Jar Package -->
    <g transform="translate(920, 250)">
      <rect x="0" y="0" width="140" height="65" rx="10" fill="#062c43" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="70" y="30" font-family="sans-serif" font-size="12" fill="#7dd3fc" font-weight="bold" text-anchor="middle">MAVEN / JVM</text>
      <text x="70" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">.jar • SHA-256</text>
      <circle cx="125" cy="15" r="4" fill="#38bdf8" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Connecting Dynamic Flow Lines -->
    <path d="M 980 105 L 940 105 L 940 282 L 920 282" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="4,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="2s" repeatCount="indefinite" />
    </path>

    <path d="M 1030 192.5 L 960 192.5 L 960 250" stroke="#f43f5e" stroke-width="1.5" fill="none" stroke-dasharray="4,4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Scanning Light Ray -->
  <g class="scanning-beam">
    <rect x="0" y="0" width="150" height="360" fill="url(#accentGradient)" opacity="0.08" transform="skewX(-20)" />
  </g>

  <!-- Foreground Content Block (Left-Aligned, Completely Unobscured Header) -->
  <g transform="translate(60, 0)">

    <!-- Top Badge Pillar -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="url(#badgeGradient)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="130" y="19" class="tag-text" text-anchor="middle">⚡ DEVOPS &amp; DEVPACK ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">
      Awesome Software Artifact
    </text>
    <text x="0" y="180" class="title" fill="url(#accentGradient)" filter="url(#glow)">
      Repository Ecosystem
    </text>

    <!-- Subtitle & Description -->
    <text x="0" y="225" class="subtitle">
      Curated directory of SaaS artifact platforms, self-hosted registries &amp; package managers
    </text>
    <text x="0" y="252" font-family="sans-serif" font-size="14" fill="#6b7280">
      Universal coverage: Docker/OCI • npm • PyPI • Maven • NuGet • Helm • Debian • RPM • Cargo
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">📦 SaaS &amp; Cloud</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="75" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">🔓 Open-Source OSS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="170" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="85" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600" text-anchor="middle">🛡️ Supply Chain Security</text>
      </g>
    </g>

  </g>
</svg>
